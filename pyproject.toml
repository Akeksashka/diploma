[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macro-monitor"
version = "0.1.0"
description = "Monitoring of macroeconomic data from open sources."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Approved runtime dependencies only: ADR-004 (httpx, sdmx1, lxml, openpyxl, pyarrow,
# psycopg v3, pandera, PyYAML, zstandard) and ADR-016 (jsonschema, pandas).
# Anything else needs a new ADR.
dependencies = [
    "httpx",
    "sdmx1",
    "lxml",
    "openpyxl",
    "pyarrow",
    "psycopg[binary]",
    "pandera",
    "pandas",
    "PyYAML",
    "zstandard",
    "jsonschema",
]

[project.scripts]
macro-monitor = "macro_monitor.cli:main"

[dependency-groups]
# ADR-016: pytest-socket and pytest-timeout are the only approved plugins.
# No pytest-cov, pytest-xdist, hypothesis or pytest-asyncio.
dev = [
    "pytest",
    "pytest-socket",
    "pytest-timeout",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/macro_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# docs/ holds phase artifacts (Markdown with illustrative code blocks), not project code.
extend-exclude = ["docs", "data", "site/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

# Third-party libraries without bundled type information. Stub packages are not on the
# approved dependency list (ADR-004/ADR-016), so missing stubs are ignored instead.
[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "jsonschema.*", "sdmx", "sdmx.*", "pyarrow", "pyarrow.*", "zstandard", "pandera", "pandera.*", "lxml", "lxml.*", "openpyxl", "openpyxl.*", "pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --import-mode=importlib -ra"
timeout = 60
timeout_method = "thread"
markers = [
    "unit: no network, no database (sockets blocked by pytest-socket)",
    "db: needs Postgres (MM_TEST_DATABASE_URL)",
    "db_invariants: restore-test suite (needs Postgres)",
    "network: live probe; runs only with -m network and MM_ALLOW_NETWORK=1",
]
