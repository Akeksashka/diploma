# Indicator catalog (docs/specs/source-config-schema.md section 3), transcribed by T32 from the approved
# selection (docs/research/indicator-selection-g20-eu-cross-country.md) and the draft table of
# docs/specs/indicator-parameters-spec.md section 5. Parameters resolve against
# config/indicator_defaults.yaml (ADR-014): only values that differ from the family are written here.
# No `alert.override` entry exists in v1 (rule 20, Q50, OQ-15). `is_support` is not authored (DG-02).
# Review status: every row is `proposed`; only the user records `confirmed` (with `by` and `on`).
# The plan (BL-12) says the user confirmed the parameters on 2026-10-27 in session; that statement
# is not recorded here until the user (not an agent) supplies it.
# Domains: 11, the DDL / source-config list; the empty `markets` domain was dropped on 2026-10-27
# (plan OQ-12, source-config rule 13, AC-CFG-15), so it is not written (the T32 brief said 12).
domains:
  - {id: growth, name: Growth, ranked: true, min_coverage_for_rank: 0.5}   # B8 proposed default, user to confirm
  - {id: prices, name: Prices and inflation, ranked: true, min_coverage_for_rank: 0.5}   # B8 proposed default, user to confirm
  - {id: labour, name: Labour market, ranked: true, min_coverage_for_rank: 0.5}   # B8 proposed default, user to confirm
  - {id: external, name: External, ranked: true, min_coverage_for_rank: 0.5}   # B8 proposed default, user to confirm
  - {id: fiscal, name: Fiscal, ranked: true, min_coverage_for_rank: 0.5}   # B8 proposed default, user to confirm
  - {id: fin, name: Financial, ranked: true, min_coverage_for_rank: 0.5}   # B8 proposed default, user to confirm
  - {id: social, name: Social, ranked: true, min_coverage_for_rank: 0.5}   # B8 proposed default, user to confirm
  - {id: structural, name: Structural, ranked: true, min_coverage_for_rank: 0.5}   # B8 proposed default, user to confirm
  - {id: environment, name: Environment, ranked: true, min_coverage_for_rank: 0.5}   # B8 proposed default, user to confirm
  - {id: agri, name: Agri-food, ranked: false, notice: "informational, unranked"}
  - {id: global, name: Global series, ranked: false, notice: "informational, unranked"}

indicators:
