  entity: AUT
  indicator: X01
  role: headline
  rationale: 'Eurostat namq_10_gdp B1GQ, current prices, million national currency, SCA: a quarterly PERIOD
    level, not annualised (research docs/research/data-sources-support-series-reserves-targets.md F1,
