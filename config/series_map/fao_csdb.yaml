# Series map of group fao_csdb. Key = parser series_ref: column A of the CSDB worksheet. [UNVERIFIED]
# Parsed by fao_csdb_v2 from block title and item header (real layout); this one series keeps its v1 name. The marketing-year
# status (OBS/EST/PROJ) is INFERRED from row position, not stated in the file; observations carry source_flags=status-inferred. World aggregate only (research F11:
# per-country ratios exist only in AMIS); G03 is a scope: global indicator (WLD only), so no country
# pairs exist. Our stored copy is the only vintage of each brief.
series:
  - dataset: csdb
    key: "World cereals stocks-to-use ratio (%)"
    entity: WLD
    indicator: G03
    role: headline
    valid_from: 1991-01-01
    rationale: "FAO Cereal Supply and Demand Brief, world cereals stocks-to-use ratio by marketing year (data-sources research F11, G03)"
    expect: {frequency: A, unit: PCT, seasonal_adjustment: NA, price_basis: NA}
