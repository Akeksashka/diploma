# Series map of group ec_bcs_monthly. Key = the MONTHLY header of the workbook: <EC country code>.<survey code>
# (verified against the real file, probe 2026-11-10; EU = EU27 aggregate, EA = euro area).
# TEMPORARY (2026-11-15, user decision): M03 maps the industry balance (INDU) again so the dashboard export passes EXP-02/COMP-02:
# the ESI series were never registered (the loaded file predates the map change, raw_load is append-only). Restore ESI (the
# 2026-11-10 decision: M03 "EC ESI, OECD BCI" = ESI index, avg 100) when the ESI series are loaded, e.g. with the EC 2611 edition. Seed set only (two countries
# plus the EU27 and euro-area aggregates); widen with the series-map seeding report.
series:
