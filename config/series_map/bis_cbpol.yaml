    key: "M.US"
    entity: USA
    indicator: M17
    role: headline
    valid_from: 1991-01-01
    rationale: "BIS central bank policy rates, monthly, United States (data-sources research F9, M17)"
    expect: {frequency: M, unit: PCT, seasonal_adjustment: NA, price_basis: NA}
