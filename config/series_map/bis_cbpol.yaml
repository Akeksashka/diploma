# Series map of group bis_cbpol (source-config-schema section 4). Key = parser series_ref: the KEY
# column without the dataflow prefix. [UNVERIFIED] against a live BIS file: keys follow the
# synthetic fixture. Seed set only (two countries); widen with the series-map seeding report
# (T52 reviewed CSV not supplied). Bulgaria has no BIS policy-rate series: known_gap M17/BGR.
series:
