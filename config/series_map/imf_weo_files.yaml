# Series map of group imf_weo_files (IMF WEO October 2026 data-portal CSV, parser weo_v1). Key = parser series_ref: SERIES_CODE <ISO3>.<INDICATOR>.A.
# Seed set: the 42 panel countries (aggregates EA, EU27, WLD have no WEO row under those codes). A02 only for the 25 countries with a published gap (research F6; the other 17 are known_gaps).
# Not mapped (decision needed): LUR, PCPIPCH, BCA_NGDPD, GGXONLB_NGDP (secondary A03/A04 variables: one headline per indicator and entity, ADR-009), A01 (PPPPC), A25 (NGDP_D index).
# Years after LATEST_ACTUAL_ANNUAL_DATA are loaded as PROJ (weo_v1); vintage_label = WEO-<YYYY>-<MM>.
series:
  - dataset: IMF.RES:WEO
    key: "AUS.NGAP_NPGDP.A"
    entity: AUS
    indicator: A02
    role: headline
    valid_from: 1991-01-01
    rationale: "IMF WEO output gap, percent of potential GDP (IMF estimate, headline A02; data-sources F6); AUS"
    expect: {frequency: A, unit: PCT_POT_GDP, seasonal_adjustment: NA, price_basis: NA}
