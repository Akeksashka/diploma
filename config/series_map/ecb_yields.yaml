# Series map of group ecb_yields (source-config-schema section 4). Key = parser series_ref: the
# ECB series key without the dataflow prefix. [UNVERIFIED] against a live capture: keys follow the
# synthetic fixture. Euro-area aggregates declare expect.composition; FIXED and CHANGING are never
# spliced (the connector rejects a pair that mixes them).
series:
  - dataset: IRS
    key: "M.DE.L.L40.CI.0000.EUR.N.Z"
    entity: DEU
    indicator: M18
    role: headline
    valid_from: 1991-01-01
    rationale: "ECB IRS long-term government bond yield (convergence criterion), Germany (data-sources research F13, M18)"
    expect: {frequency: M, unit: PURE_NUMB, seasonal_adjustment: NSA, price_basis: NA}
  - dataset: IRS
    key: "M.U2.L.L40.CI.0000.EUR.N.Z"
    entity: EA
    indicator: M18
    role: headline
    valid_from: 1991-01-01
    rationale: "ECB IRS long-term yield, euro area aggregate; composition declared, not spliced (data-sources research F13)"
    expect: {frequency: M, unit: PURE_NUMB, seasonal_adjustment: NSA, price_basis: NA, composition: CHANGING}
