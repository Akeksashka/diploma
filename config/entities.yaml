# Entities and group memberships (docs/specs/source-config-schema.md section 1; rule 14).
# Source: docs/research/indicator-selection-g20-eu-cross-country.md, "Coverage" (EU27 + G20 minus
# Russia = 42 countries; aggregates EU27, EA are unranked, D1) and "Metadata sub-groupings".
# Plus WLD (aggregate, is_global, unranked) per the DDL (ref.entity).
# [UNVERIFIED] items, to be checked by a reader against the selection document and the sources named:
#  - euro_area: Bulgaria from 2026-01-01 (selection doc marks it UNVERIFIED; ECB, https://www.ecb.europa.eu);
#    other accession dates are the standard euro adoption dates, not re-checked in this task.
#  - advanced / emerging: IMF WEO classification as recalled by the implementer (Croatia advanced,
#    Bulgaria emerging); not checked against the current WEO table. valid_from 1991-01-01 is a
#    convention for a static classification and for G7 / non-euro EU.
